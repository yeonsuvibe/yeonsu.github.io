<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ahn Yeonsu — Navigation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<style>
:root{--serif:'Cormorant Garamond',serif;--sans:'Jost',sans-serif;--ink:#16150f;--soft:#4a463c;--crimson:#8f1616;--line:rgba(22,21,15,.18)}
html,body{background:transparent;margin:0;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--sans);color:var(--ink);pointer-events:none;user-select:none;
  padding:22px 38px}
header *{pointer-events:auto}
.brand{font-family:var(--serif);font-size:.95rem;letter-spacing:.4em;font-weight:600}
.dnav{display:flex;gap:16px;font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}
.dnav a{color:inherit;text-decoration:none;opacity:.75}
.dnav a.on,.dnav a.active{color:var(--ink);border-bottom:2px solid var(--crimson);padding-bottom:3px;opacity:1}
@media (max-width:760px){header{padding:16px 18px}.brand{font-size:1rem}}
</style>
</head>
<body>
<header>
  <div class="brand"><a data-nav="gallery" href="variant-b.html?auto=0" style="color:inherit;text-decoration:none">Ahn Yeonsu</a></div>
  <nav class="dnav">
    <a data-nav="home"    href="index.html">Home</a>
    <a data-nav="gallery" href="variant-b.html?auto=0" class="on">Art Gallery</a>
    <a data-nav="travel"  href="journeys.html">Cultural Journeys</a>
    <a data-nav="press"   href="articles.html">Ahn Yeonsu &middot; Press</a>
  </nav>
</header>
<script>
/* Embedded in the gallery (or a sheet), clicks become commands to the parent frame
   instead of page loads; the parent routes them — open the wall, go home, back to the room.
   Opened on its own, it behaves as a plain page with normal links. */
if (window.top !== window) {
  document.querySelectorAll('a[data-nav]').forEach(a => {
    a.addEventListener('click', e => { e.preventDefault(); parent.postMessage('nav:' + a.dataset.nav, '*'); });
  });
  addEventListener('message', e => {                       // parent tells us which section is live
    const k = (e.data || '').replace('nav:', '');
    document.querySelectorAll('a[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === k));
  });
}
</script>
</body>
</html>
